# Wakalah policy rules — version v1
#
# This file is the deterministic authority. The AI agent proposes a risk tier,
# a verification plan and a recommendation; these rules decide what actually
# happens. Same facts + same rules => same verdict, always (docs/04 section 4).
#
# Versioned on purpose: every Decision records the policy_version that produced
# it, so an auditor can replay a months-old verdict against the exact rules in
# force at the time. Never edit a released version in place — add v2.

version: v1

# --- Risk tiering ----------------------------------------------------------
# The agent classifies risk, but it cannot classify BELOW this deterministic
# baseline. Effective tier = max(agent tier, baseline tier). This is what stops
# a mis-classification from under-checking a dangerous transaction.
tiering:
  medium_amount: 500          # >= this amount is at least MEDIUM
  high_amount: 2000           # >= this amount is at least HIGH
  new_beneficiary_min_tier: medium
  challenge_only_min_tier: high   # a principal under challenge-only mode

# --- Minimum verification floors ------------------------------------------
# The plan the agent builds must contain at least these signals for the
# effective tier. The agent may add more; it can never run fewer.
floors:
  issuance:                   # creating a mandate
    low: [kyc_match, sim_swap]
    medium: [kyc_match, sim_swap, device_swap]
    high: [kyc_match, sim_swap, device_swap, number_recycling, tenure]
  transaction:                # evaluating a payment
    low: [sim_swap]
    medium: [sim_swap, device_swap, call_forwarding]
    high: [sim_swap, device_swap, call_forwarding, number_recycling, reachability]

# --- Signal freshness ------------------------------------------------------
# How far back a hijack check looks. Higher risk asks a stricter question:
# "was there a swap in the last 24 hours" is stricter than "in the last 30 days".
freshness:
  sim_swap_max_age_hours:
    low: 720
    medium: 240
    high: 24
  device_swap_max_age_hours:
    low: 720
    medium: 240
    high: 72

# --- Verdict rules ---------------------------------------------------------
# Evaluated in order; the most severe outcome wins. Each rule carries a stable
# reason code that partners can build their own logic on.
verdicts:
  deny:
    - mandate_not_active            # revoked, expired, or unknown mandate
    - amount_exceeds_mandate_limit
    - beneficiary_not_permitted
    - identity_mismatch             # KYC Match says the claimed identity is wrong
    - number_recycled               # the subscriber behind the number changed
    - sim_swap_recent_high_value    # the classic takeover pattern
  step_up:
    - sim_swap_recent_low_value
    - device_swap_recent
    - call_forwarding_active        # possible OTP/voice interception
    - principal_challenge_only
    - number_not_verified
    - device_unreachable
    - location_inconsistent
    - insufficient_evidence         # floor not satisfied: cannot decide safely

# Amounts at or above this, combined with a recent SIM swap, are denied rather
# than challenged: the classic account-takeover pattern at material value.
thresholds:
  swap_deny_amount: 250
  location_check_amount: 1000
